services:
  iiol:
    build: .
    container_name: iiol-app
    restart: unless-stopped
    ports:
      - "8018:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-cloudpark.duckdns.org,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://cloudpark.duckdns.org}
      LIBRARY_API_KEY: ${LIBRARY_API_KEY:-}
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - iiol-data:/app/data

volumes:
  iiol-data:
